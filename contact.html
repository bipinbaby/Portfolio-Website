<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Bipin Baby</title>

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages/contact.css" />

  <!-- Lenis smooth scroll -->
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof Lenis !== 'undefined') {
        const lenis = new Lenis({ duration: 1.25, easing: t => Math.min(1, 1.001 - Math.pow(2, -10 * t)), smoothWheel: true });
        function raf(t) { lenis.raf(t); requestAnimationFrame(raf); }
        requestAnimationFrame(raf);
      }
    });
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

  <nav class="nav"></nav>

  <!-- ── Contact ────────────────────────────────────────── -->
  <main class="contact-hero section">
    <div class="container">
      <div class="contact-inner">

        <!-- ── Left: intro + socials ─────────────────────── -->
        <div class="contact-copy">
          <p class="section-label">Contact</p>
          <h1 class="section-title">Let's make<br />something.</h1>
          <p>
            Open to creative technology roles, interactive installation
            projects, digital twin commissions, and collaboration.
          </p>

          <!--
            UPDATE YOUR EMAIL HERE and in js/config.js → SITE.email
          -->
          <a href="mailto:bipinbabyvarghese@gmail.com" class="contact-email">bipinbabyvarghese@gmail.com</a>

          <!-- Social links (auto-generated from config.js) -->
          <div class="contact-socials" id="contact-socials"></div>
        </div>

        <!-- ── Right: contact form ───────────────────────── -->
        <div class="contact-panel glass-card">
          <h3>Send a message</h3>
          <form id="contact-form" novalidate>
            <!-- Replace YOUR_WEB3FORMS_KEY with your key from web3forms.com -->
            <input type="hidden" name="access_key" value="ec0c80e8-a9fd-4d7f-bd39-af594dc7a369" />
            <input type="hidden" name="subject" value="Portfolio Contact — Bipin Baby" />
            <input type="checkbox" name="botcheck" style="display:none" />

            <div class="form-group">
              <label for="cf-name">Name</label>
              <input type="text" id="cf-name" name="name" placeholder="Your name" required />
            </div>

            <div class="form-group">
              <label for="cf-email">Email</label>
              <input type="email" id="cf-email" name="email" placeholder="your@email.com" required />
            </div>

            <div class="form-group">
              <label for="cf-message">Message</label>
              <textarea id="cf-message" name="message" placeholder="Tell me about your project or role..." rows="5" required></textarea>
            </div>

            <button type="submit" class="btn btn-primary" id="form-submit">Send Message →</button>
            <p id="form-status" class="form-status" aria-live="polite"></p>
          </form>
        </div>

      </div>
    </div>
  </main>

  <footer class="footer"></footer>

  <script type="module">
    import { initNav, initFooter }  from './js/components/nav.js';
    import { SOCIALS }              from './js/config.js';

    initNav();
    initFooter();

    // Render social links in the contact section
    const socialsEl = document.getElementById('contact-socials');
    if (socialsEl) {
      socialsEl.innerHTML = SOCIALS.map(s => `
        <a href="${s.url}" target="_blank" rel="noopener" class="contact-social-link">
          ${s.label}
        </a>
      `).join('');
    }

    // ── Contact form submission ───────────────────────────────
    const form      = document.getElementById('contact-form');
    const statusEl  = document.getElementById('form-status');
    const submitBtn = document.getElementById('form-submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Basic client-side validation
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      submitBtn.disabled    = true;
      submitBtn.textContent = 'Sending...';
      statusEl.textContent  = '';
      statusEl.className    = 'form-status';

      try {
        const res    = await fetch('https://api.web3forms.com/submit', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body:    JSON.stringify(Object.fromEntries(new FormData(form))),
        });
        const result = await res.json();

        if (result.success) {
          statusEl.textContent = 'Message sent — I\'ll get back to you soon.';
          statusEl.className   = 'form-status form-status--success';
          form.reset();
        } else {
          throw new Error(result.message || 'Submission failed');
        }
      } catch {
        statusEl.textContent = 'Something went wrong. Email me directly at bipinbabyvarghese@gmail.com';
        statusEl.className   = 'form-status form-status--error';
      } finally {
        submitBtn.disabled    = false;
        submitBtn.textContent = 'Send Message →';
      }
    });
  </script>

</body>
</html>
